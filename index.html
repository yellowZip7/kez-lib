<style>

<script id="logic">
// HOW TO ADD A SHOW: copy one entry below and edit its five fields.
// Only use official watch links (Viki, Netflix, library apps like Kanopy/Hoopla, official YouTube channels).
const STATUSES = ["Watching", "Up next", "Finished"];
const SHOWS = [];
function getStatus(title) {
  try {
    const v = localStorage.getItem("kdw:" + title);
    return STATUSES.indexOf(v) >= 0 ? v : "Up next";
  } catch (e) { return "Up next"; }
}
function setStatus(title, status) {
  if (STATUSES.indexOf(status) < 0) return;
  try { localStorage.setItem("kdw:" + title, status); } catch (e) {}
}
function getSavedTheme() {
  try {
    const v = localStorage.getItem("kdw-theme");
    return v === "light" || v === "dark" ? v : null;
  } catch (e) { return null; }
}
function saveTheme(t) {
  if (t !== "light" && t !== "dark") return;
  try { localStorage.setItem("kdw-theme", t); } catch (e) {}
}
function themeToggleLabel(t) { return t === "dark" ? "Switch to light mode" : "Switch to dark mode"; }
function nextTheme(t) { return t === "dark" ? "light" : "dark"; }
function hasSeenIntro() {
  try { return sessionStorage.getItem("kdw-intro") === "1"; } catch (e) { return false; }
}
function markIntroSeen() {
  try { sessionStorage.setItem("kdw-intro", "1"); } catch (e) {}
}
const LIMITS = { title: 100, service: 40, watchUrl: 500, synopsis: 600, note: 300, poster: 40000, shows: 200 };
const BLOCKED_SCHEMES = /^(javascript|data|vbscript):/;
function normalizeLink(raw) {
  const t = String(raw == null ? "" : raw).trim();
  if (!t) return { ok: true, url: "" };
  const probe = t.replace(/[\u0000-\u0020\u007f]/g, "").toLowerCase();
  if (BLOCKED_SCHEMES.test(probe)) return { ok: false, error: "That doesn’t look like a watch link." };
  if (!/^[a-z][a-z0-9+.-]*:/i.test(t)) return { ok: true, url: "https://" + t };
  return { ok: true, url: t };
}
function validateShowInput(input, existing, editingId) {
  const str = function (x) { return String(x == null ? "" : x); };
  const errors = {};
  const v = { title: str(input.title).trim(), service: str(input.service).trim(), watchUrl: str(input.watchUrl).trim(), synopsis: str(input.synopsis).trim(), poster: str(input.poster), status: input.status || "Up next", fromBaba: input.fromBaba === true, note: str(input.note).trim() };
  if (!v.title) errors.title = "Please give the show a title.";
  else if (v.title.length > LIMITS.title) errors.title = "That title is too long (100 characters at most).";
  else if (existing.some(function (s) { return s.id !== editingId && str(s.title).trim().toLowerCase() === v.title.toLowerCase(); })) errors.title = "You already have a show with that title.";
  if (v.service.length > LIMITS.service) errors.service = "That name is too long (40 characters at most).";
  if (v.synopsis.length > LIMITS.synopsis) errors.synopsis = "That summary is too long (600 characters at most).";
  const link = normalizeLink(v.watchUrl);
  if (!link.ok) errors.watchUrl = link.error;
  else if (link.url.length > LIMITS.watchUrl) errors.watchUrl = "That link is too long.";
  else v.watchUrl = link.url;
  if (v.poster && (v.poster.indexOf("data:image/jpeg;base64,") !== 0 || v.poster.length > LIMITS.poster)) errors.poster = "That picture couldn’t be used.";
  if (STATUSES.indexOf(v.status) < 0) v.status = "Up next";
  if (v.note.length > LIMITS.note) errors.note = "That note is too long (300 characters at most).";
  if (!editingId && existing.length >= LIMITS.shows) errors.limit = "You’ve reached 200 shows. Remove one to add another.";
  return Object.keys(errors).length ? { ok: false, errors: errors } : { ok: true, value: v };
}
function newId() { return "s" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function applyOp(shows, op) {
  if (op.type === "del") return shows.filter(function (s) { return s.id !== op.id; });
  const i = shows.findIndex(function (s) { return s.id === op.show.id; });
  if (i < 0) return shows.concat([op.show]);
  const copy = shows.slice(); copy[i] = op.show; return copy;
}
function mergeShows(server, outbox) {
  return outbox.reduce(function (acc, op) { return applyOp(acc, op); }, server.slice());
}
function splashTimings(reducedMotion) {
  return reducedMotion ? { reveal: 970, end: 1200 } : { reveal: 2100, end: 2600 };
}
function pickFeatured(shows, getStatusFn) {
  if (!shows.length) return null;
  return shows.find(function (s) { return getStatusFn(s.title) === "Watching"; }) || shows[0];
}
</script>

<script id="page">
const $ = id => document.getElementById(id);
const ROW_TITLES = { "Watching": "Continue Watching", "Up next": "Up Next", "Finished": "Finished" };
let current = null;
function esc(x) { return String(x).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
function hue(t) { let h = 0; for (const ch of t) h = (h * 31 + ch.charCodeAt(0)) % 97; return [340, 10, 25, 280, 320, 350][h % 6]; }
function posterHTML(s) {
  return s.poster ? '<img src="' + esc(s.poster) + '" alt="" loading="lazy">'
    : '<div class="ph" style="--h:' + hue(s.title) + '"><span>' + esc(s.title) + '</span></div>';
}
const LS = {
  get: function (k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
  del: function (k) { try { localStorage.removeItem(k); } catch (e) {} }
};
function readJSON(k, fallback) { try { const v = JSON.parse(LS.get(k)); return v == null ? fallback : v; } catch (e) { return fallback; } }
function readList(k) { const v = readJSON(k, []); return Array.isArray(v) ? v : []; }
let cloudShows = readList("kdw-cache");
let syncMode = "unknown";
function allShows() {
  return SHOWS.map(function (s) {
    return { id: "code:" + s.title, source: "code", title: s.title, poster: s.poster || "", synopsis: s.synopsis || "", watchUrl: s.watchUrl || "", service: s.service || "", status: getStatus(s.title) };
  }).concat(cloudShows.filter(function (s) { return !s.fromBaba; }).map(function (s) { return Object.assign({ source: "cloud" }, s); }));
}
function setNote(text) { $("syncnote").textContent = text || ""; }
function writeOutbox(q) { LS.set("kdw-outbox", JSON.stringify(q)); }
function queueOp(op) { const q = readList("kdw-outbox"); q.push(op); writeOutbox(q); setNote("Will sync when online."); }
function commitOp(op) {
  cloudShows = applyOp(cloudShows, op);
  if (syncMode === "local") { LS.set("kdw-local-shows", JSON.stringify(cloudShows)); }
  else { LS.set("kdw-cache", JSON.stringify(cloudShows)); queueOp(op); flushOutbox(); }
  renderAll();
}
function setShowStatus(show, status) {
  if (STATUSES.indexOf(status) < 0) return;
  if (show.source === "code") { setStatus(show.title, status); return; }
  const base = cloudShows.find(function (s) { return s.id === show.id; });
  if (base) commitOp({ type: "put", show: Object.assign({}, base, { status: status }) });
}
async function apiCall(method, query, body) {
  let r;
  try {
    const headers = { "Content-Type": "application/json" };
    const pass = LS.get("kdw-pass");
    if (pass) headers["x-passcode"] = pass;
    r = await fetch("/api/shows" + (query || ""), { method: method, headers: headers, body: body ? JSON.stringify(body) : undefined });
  } catch (e) { return { status: 0, data: null }; }
  try { return { status: r.status, data: await r.json() }; }
  catch (e) { return { status: r.status >= 500 ? 500 : 404, data: null }; }
}
let flushing = false;
async function flushOutbox() {
  if (flushing || syncMode === "local" || syncMode === "locked" || syncMode === "throttled") return;
  flushing = true;
  let dropped = false, sent = 0;
  try {
    while (readList("kdw-outbox").length) {
      const op = readList("kdw-outbox")[0];
      const r = op.type === "del" ? await apiCall("DELETE", "?id=" + encodeURIComponent(op.id)) : await apiCall("PUT", "", { show: op.show });
      if (r.status === 200 || r.status === 400) {
        const q = readList("kdw-outbox"); q.shift(); writeOutbox(q);
        if (r.status === 400) dropped = true; else sent++;
        continue;
      }
      handleStatus(r.status); return;
    }
    if (dropped) { setNote("One change couldn’t be saved, so it was undone."); setTimeout(refreshFromServer, 0); }
    else if (sent) { setNote("Saved."); }
  } finally { flushing = false; }
}
function handleStatus(st) {
  if (st === 401) { const had = !!LS.get("kdw-pass"); LS.del("kdw-pass"); syncMode = "locked"; showPrompt(had ? "That passcode didn’t work. Please try again." : ""); }
  else if (st === 429) { syncMode = "throttled"; showPrompt("Too many tries. Please wait a few minutes and try again."); }
  else if (st === 404) { switchToLocal(); }
  else if (st === 0) { setNote("Offline. Changes will sync when you’re back online."); }
  else { setNote("Couldn’t sync just now. Will try again."); }
}
function switchToLocal() {
  syncMode = "local"; hidePrompt();
  cloudShows = readList("kdw-local-shows");
  setNote("Sync is off here, so shows are saved on this device only.");
  renderAll();
}
async function refreshFromServer() {
  if (syncMode === "local") return;
  if ((syncMode === "locked" || syncMode === "throttled") && !LS.get("kdw-pass")) return;
  const r = await apiCall("GET", "");
  if (r.status === 200 && r.data && Array.isArray(r.data.shows)) {
    syncMode = "cloud"; hidePrompt();
    cloudShows = mergeShows(r.data.shows, readList("kdw-outbox"));
    LS.set("kdw-cache", JSON.stringify(cloudShows));
    renderAll();
    await flushOutbox();
    return;
  }
  handleStatus(r.status);
}
function showPrompt(msg) {
  $("lockmsg").textContent = msg || "This is Keziah’s private list. Enter the passcode to continue.";
  $("lock").hidden = false;
  try { $("passin").focus(); } catch (e) {}
}
function hidePrompt() { $("lock").hidden = true; }
function submitPass() {
  const v = $("passin").value;
  if (!v) return;
  LS.set("kdw-pass", v); $("passin").value = ""; hidePrompt(); syncMode = "unknown";
  refreshFromServer();
}
function startSync() {
  $("passgo").addEventListener("click", submitPass);
  $("passin").addEventListener("keydown", function (e) { if (e.key === "Enter") submitPass(); });
  window.addEventListener("focus", refreshFromServer);
  window.addEventListener("online", refreshFromServer);
  refreshFromServer();
}
function renderHero() {
  const all = allShows(), el = $("hero");
  const f = pickFeatured(all, function (t) { const x = all.find(function (y) { return y.title === t; }); return x ? x.status : "Up next"; });
  if (!f) { el.innerHTML = ""; el.style.removeProperty("--hero-img"); return; }
  el.style.setProperty("--hero-img", f.poster ? "url('" + String(f.poster).replace(/['"\\()]/g, encodeURIComponent) + "')" : "var(--hero-fallback)");
  el.innerHTML = '<div class="hbody"><h2>' + esc(f.title) + '</h2><p>' + esc(f.synopsis) + '</p><div class="btns">' +
    (f.watchUrl ? '<a class="btn" href="' + esc(f.watchUrl) + '" target="_blank" rel="noopener">Watch on ' + esc(f.service || "the official site") + '</a>' : '') +
    '<button class="btn gray" data-id="' + esc(f.id) + '">More info</button></div></div>';
}
let fq = "", ff = "all";
function matches(s) {
  if (!fq) return true;
  return (s.title + " " + (s.service || "") + " " + (s.synopsis || "") + " " + (s.note || "")).toLowerCase().indexOf(fq) >= 0;
}
function cardHTML(s, i, c, badge) {
  const rt = s.source === "baba" ? 0 : getRate(s.title).r;
  return '<button class="card" style="--i:' + i + ';--c:' + Math.min(c, 8) + '" data-id="' + esc(s.id) + '">' + posterHTML(s) + '<span class="badge">' + badge + '</span>' +
    (rt ? '<span class="rate">★ ' + rt + '</span>' : '') +
    (s.poster ? '<span class="t">' + esc(s.title) + '</span>' : '') + '</button>';
}
function renderRows() {
  let ri = 0, out = "";
  const all = allShows(), picks = pickList(), groups = [];
  if (picks.length) groups.push({ name: "From Baba", key: "baba", list: picks, badge: "From Baba" });
  STATUSES.forEach(st => groups.push({ name: ROW_TITLES[st], key: st, list: all.filter(s => s.status === st), badge: st }));
  groups.forEach(g => {
    if (ff !== "all" && ff !== g.key) return;
    const list = g.list.filter(matches);
    if (!list.length) return;
    const i = ri++;
    out += '<section class="rowwrap" style="--i:' + i + '"><h3>' + g.name + '</h3><div class="row">' + list.map((s, c) => cardHTML(s, i, c, g.badge)).join("") + '</div></section>';
  });
  if (!out && (all.length || picks.length)) out = '<p class="nomatch">No shows match' + (fq ? ' “' + esc(fq) + '”' : '') + '.</p>';
  $("rows").innerHTML = out;
}
function renderAll() {
  renderHero(); renderRows();
  const empty = allShows().length === 0;
  $("firstrun").hidden = !empty; $("hero").hidden = empty;
  $("toolbar").hidden = empty && pickList().length === 0;
}
function openPanel(id) {
  const s = allShows().find(x => x.id === id) || pickList().find(x => x.id === id);
  if (!s) return;
  current = s;
  if (s.source === "baba") { openPickPanel(s); return; }
  const st = s.status;
  $("pbody").innerHTML = '<div class="pposter">' + posterHTML(s) + '</div><h2 id="pt">' + esc(s.title) + '</h2><p>' + esc(s.synopsis) + '</p>' +
    '<div class="srow">' + STATUSES.map(x => '<button class="sbtn" data-s="' + x + '" aria-pressed="' + (x === st) + '">' + x + '</button>').join("") + '</div>' +
    (s.watchUrl ? '<a class="watch" href="' + esc(s.watchUrl) + '" target="_blank" rel="noopener">Watch on ' + esc(s.service || "the official site") + '</a>' : '') +
    (s.source === "cloud" ? '<div class="srow"><button class="sbtn" data-act="edit">Edit</button><button class="sbtn" data-act="remove">Remove</button></div>' : '');
  $("panel").hidden = false; $("backdrop").hidden = false;
  renderRatingBox(s);
}
function pickList() {
  const have = allShows().map(s => s.title.toLowerCase());
  return cloudShows.filter(s => s.fromBaba && have.indexOf(String(s.title).toLowerCase()) < 0).map(s => Object.assign({}, s, { source: "baba" }));
}
function openPickPanel(s) {
  $("pbody").innerHTML = '<div class="pposter">' + posterHTML(s) + '</div><h2 id="pt">' + esc(s.title) + '</h2><p>' + esc(s.synopsis || "") + '</p>' +
    '<div class="bnote"><b>Baba says</b>' + esc(s.note || "") + '</div>' +
    (s.watchUrl ? '<a class="watch" href="' + esc(s.watchUrl) + '" target="_blank" rel="noopener">Watch on ' + esc(s.service || "the official site") + '</a>' : '') +
    '<div class="srow"><button class="btn" type="button" data-pick="add">Add to my list</button></div><div class="srow"><button class="sbtn" data-act="edit">Edit</button><button class="sbtn" data-act="remove">Remove</button></div>';
  $("panel").hidden = false; $("backdrop").hidden = false;
}
function getRate(title) {
  const v = readJSON("kdw-rate:" + title, null);
  if (!v || typeof v !== "object") return { r: 0, n: "" };
  return { r: Math.max(0, Math.min(5, Math.round(+v.r || 0))), n: typeof v.n === "string" ? v.n : "" };
}
function setRate(title, o) { if (!o.r && !o.n) LS.del("kdw-rate:" + title); else LS.set("kdw-rate:" + title, JSON.stringify(o)); }
function renderRatingBox(s) {
  const rt = getRate(s.title);
  let stars = "";
  for (let n = 1; n <= 5; n++) stars += '<button type="button" class="star' + (n <= rt.r ? ' on' : '') + '" data-star="' + n + '" aria-label="' + n + (n > 1 ? ' stars' : ' star') + '">★</button>';
  const box = document.createElement("div");
  box.className = "rbox";
  box.innerHTML = '<div class="rlabel">Your rating</div><div class="stars">' + stars + '</div><textarea id="rnote" class="field" rows="3" maxlength="300" placeholder="Your thoughts… like “cried at ep 12”"></textarea><p class="rsaved" id="rsaved"></p>';
  const edit = $("pbody").querySelector('[data-act="edit"]');
  const anchor = edit ? edit.parentNode : null;

function resizePoster(file) {
  return new Promise(function (resolve, reject) {
    if (!file || !/^image\//.test(file.type)) { reject(new Error("not an image")); return; }

        const g = c.getContext("2d"), k = Math.max(W / img.width, H / img.height), w = img.width * k, h = img.height * k;
        g.drawImage(img, (W - w) / 2, (H - h) / 2, w, h);
        let q = 0.72, out = c.toDataURL("image/jpeg", q);

        if (out.length > LIMITS.poster) reject(new Error("too big")); else resolve(out);
      } catch (e) { reject(e); }
    };
    img.onerror = function () { URL.revokeObjectURL(url); reject(new Error("bad image")); };
